<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitOps Platform Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
    textarea { width: 100%; height: 80px; }
    pre { background: #f4f4f4; padding: 12px; }
  </style>
</head>
<body>
  <h1>Sentiment demo</h1>
  <p>Frontend &rarr; API gateway &rarr; inference service (Blue/Green).</p>
  <textarea id="text">The new release is fast and reliable</textarea>
  <button id="go">Predict</button>
  <pre id="out"></pre>
  <script>
    document.getElementById("go").onclick = async () => {
      const res = await fetch("/api/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: document.getElementById("text").value }),
      });
      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    };
  </script>
</body>
</html>
