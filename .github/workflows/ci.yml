name: CI

on:
  push:
    branches: [main]
    paths: ["apps/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["apps/**", "deploy/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, inference]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlays
        run: |
          for env in dev prod; do kubectl kustomize deploy/kustomize/overlays/$env > /dev/null; done
      - name: Lint and render Helm chart
        run: |
          helm lint deploy/helm/inference
          for env in dev prod; do
            helm template inference deploy/helm/inference -f deploy/helm/inference/values-$env.yaml > /dev/null
          done

  build:
    needs: [test, validate-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, inference, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          # Commit SHA tag = traceability from a running pod back to its source.
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # GitOps: CI never touches the cluster. It commits the new tags to Git,
  # and Argo CD rolls them out.
  deploy-dev:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump dev image tags
        run: |
          (cd deploy/kustomize/overlays/dev && kustomize edit set image \
            "${IMAGE_PREFIX}/api:${GITHUB_SHA}" \
            "${IMAGE_PREFIX}/web:${GITHUB_SHA}")
          yq -i '.blue.tag = strenv(GITHUB_SHA)' deploy/helm/inference/values-dev.yaml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7}"
          git push
