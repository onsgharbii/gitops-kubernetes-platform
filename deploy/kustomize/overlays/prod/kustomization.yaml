apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-prod
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
patches:
  - target: { kind: Ingress, name: platform }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: prod.localtest.me
  - target: { kind: Deployment }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
# Image tags below are promoted from dev by the "promote" workflow.
images:
  - name: ghcr.io/onsgharbii/gitops-kubernetes-platform/api
    newTag: latest
  - name: ghcr.io/onsgharbii/gitops-kubernetes-platform/web
    newTag: latest
