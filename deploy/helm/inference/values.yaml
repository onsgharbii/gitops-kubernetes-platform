image:
  repository: ghcr.io/onsgharbii/gitops-kubernetes-platform/inference
  pullPolicy: IfNotPresent

# Blue/Green: both colors can run side by side. The main Service routes to
# `activeColor`; the preview Service routes to the other one for smoke tests.
# Release = deploy the new tag on the idle color, test it via the preview
# Service, then flip `activeColor` in Git. Argo CD applies the switch.
activeColor: blue

blue:
  enabled: true
  tag: latest
  modelVersion: v1

green:
  enabled: false
  tag: latest
  modelVersion: v2

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
